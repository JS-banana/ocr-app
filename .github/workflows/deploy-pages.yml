name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install JS dependencies
        run: pnpm install

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Download OCR models
        env:
          HF_MIRROR: https://huggingface.co
        run: |
          for model in ppocrv6-tiny ppocrv6-small ppocrv6-medium; do
            bash scripts/download_models.sh --model "$model"
          done

      - name: Extract charsets
        run: |
          python3 scripts/extract_charset.py --model ppocrv6-tiny
          python3 scripts/extract_charset.py --model ppocrv6-small
          python3 scripts/extract_charset.py --model ppocrv6-medium

      - name: Build static site
        env:
          BASE_PATH: /ocr-app
        run: pnpm build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
