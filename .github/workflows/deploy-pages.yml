name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install JS dependencies
        run: pnpm install

      - name: Install Python dependencies
        run: pip install pyyaml

      # Pages 仅打包 Tiny，缩短 CI 与首屏下载；自建部署仍用完整 models.json + 三档权重
      - name: Download Tiny model
        env:
          HF_MIRROR: https://huggingface.co
        run: bash scripts/download_models.sh --model ppocrv6-tiny

      - name: Extract Tiny charset
        run: python3 scripts/extract_charset.py --model ppocrv6-tiny

      - name: Restrict catalog to Tiny for Pages
        run: |
          node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";
            const path = "public/models.json";
            const catalog = JSON.parse(readFileSync(path, "utf8"));
            const tiny = catalog.models.filter((m) => m.id === "ppocrv6-tiny");
            if (tiny.length !== 1) throw new Error("ppocrv6-tiny missing from models.json");
            writeFileSync(path, JSON.stringify({ models: tiny }, null, 2) + "\n");
          '

      - name: Build static site
        env:
          BASE_PATH: /ocr-app
        run: pnpm build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
